<!DOCTYPE html>
<html style="background:transparent!important;margin:0;padding:0;width:100%;height:100%;overflow:hidden">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { background:transparent!important; margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
  body { position:relative; }
  #overlay { position:fixed; top:0; left:0; width:100%; height:100%; cursor:crosshair; }
  #dialog {
    position:fixed; bottom:20px; right:20px; width:420px;
    background:#fff; border-radius:10px;
    box-shadow:0 4px 24px rgba(0,0,0,.25),0 1px 4px rgba(0,0,0,.1);
    z-index:1; overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:13px; color:#1e293b;
  }
  #dialog-header {
    display:flex; align-items:center; justify-content:space-between;
    padding:10px 14px; background:#1E3A5F; color:#FFD700; font-weight:600; font-size:13px;
  }
  #quitBtn { background:none; border:none; color:#FFD700; font-size:20px; cursor:pointer; padding:0 4px; line-height:1; opacity:.7; }
  #quitBtn:hover { opacity:1; }
  #path-display {
    padding:12px 14px;
    font-family:'SF Mono','Cascadia Code','Fira Code',Menlo,Consolas,monospace;
    font-size:12px; color:#1e293b; background:#f8fafc; border-bottom:1px solid #e2e8f0;
    word-break:break-all; line-height:1.5; min-height:40px; max-height:120px; overflow-y:auto; white-space:pre-wrap;
  }
  #dialog-actions { padding:10px 14px; display:flex; justify-content:flex-end; gap:8px; }
  button.primary {
    padding:7px 18px; border:none; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer;
    background:#1E3A5F; color:#FFD700; transition:background .15s;
  }
  button.primary:hover { background:#2a5070; }
  button.primary:active { background:#16304a; }
</style>
</head>
<body style="background:transparent!important;margin:0;padding:0">
  <svg id="overlay" width="100%" height="100%">
    <path id="ocean" fill="rgba(0,0,0,0.4)" fill-rule="evenodd" d="" />
    <path id="island" fill="rgba(255,215,0,0.2)" stroke="#FFD700" stroke-width="2" d="" />
  </svg>
  <div id="dialog">
    <div id="dialog-header">
      <span id="dialog-title">Element picker</span>
      <button id="quitBtn" title="Quit">&times;</button>
    </div>
    <div id="path-display"></div>
    <div id="dialog-actions">
      <button id="copyBtn" class="primary">Copy path</button>
    </div>
  </div>
  <script src="epicker.js"></script>
</body>
</html>
